<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23ffd23e'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' font-family='sans-serif' font-weight='bold'%3ES%3C/text%3E%3C/svg%3E">
<title>Solmar Bay — Sun, Salt, Stolen Cars</title>
<style>
  :root { --gold: #ffd23e; --ink: #0c141c; --panel: rgba(10, 18, 26, 0.78); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0c141c; font-family: "Segoe UI", system-ui, sans-serif; color: #fff; }
  #game { display: block; width: 100%; height: 100%; touch-action: none; }
  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .panel { background: var(--panel); border: 1px solid rgba(255,255,255,0.14); border-radius: 10px; backdrop-filter: blur(4px); }
  #topleft { position: absolute; top: 14px; left: 14px; padding: 10px 14px; min-width: 230px; }
  #stars { font-size: 22px; letter-spacing: 3px; color: var(--gold); line-height: 1; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin-top: 7px; font-size: 12px; }
  .bar-row .lbl { width: 52px; color: #cfe0ea; }
  .bar { flex: 1; height: 10px; background: rgba(255,255,255,0.14); border-radius: 5px; overflow: hidden; }
  .bar > div { height: 100%; border-radius: 5px; }
  #health-fill { background: linear-gradient(90deg, #37c978, #7be495); width: 100%; }
  #armour-fill { background: linear-gradient(90deg, #4a90d9, #8ac2f0); width: 0%; }
  .bar-row .num { width: 30px; text-align: right; }
  #cash { font-size: 20px; font-weight: 700; color: #7be495; margin-top: 8px; }
  #respect { font-size: 13px; color: var(--gold); }
  #objective { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); padding: 9px 18px; font-size: 15px; font-weight: 600; text-align: center; max-width: 46vw; }
  #objective-dist { display: block; font-size: 12px; color: var(--gold); font-weight: 500; margin-top: 2px; }
  #minimap { position: absolute; left: 14px; bottom: 14px; width: 180px; height: 180px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.35); background: #0c141c; box-shadow: 0 4px 18px rgba(0,0,0,0.5); }
  #bottomright { position: absolute; right: 14px; bottom: 14px; padding: 10px 14px; text-align: right; min-width: 170px; }
  #speed { font-size: 30px; font-weight: 800; line-height: 1; }
  #speed-unit { font-size: 12px; color: #cfe0ea; }
  #weapon { font-size: 15px; font-weight: 600; margin-top: 6px; }
  #ammo { font-size: 13px; color: #cfe0ea; }
  #radio { font-size: 13px; color: var(--gold); margin-top: 4px; }
  #prompt { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); padding: 8px 16px; font-size: 14px; background: var(--panel); border-radius: 8px; border: 1px solid rgba(255,255,255,0.14); }
  #crosshair { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; display: none; }
  #crosshair::before, #crosshair::after { content: ""; position: absolute; background: rgba(255,255,255,0.9); }
  #crosshair::before { left: 10px; top: 0; width: 2px; height: 22px; }
  #crosshair::after { top: 10px; left: 0; width: 22px; height: 2px; }
  #vignette { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(200,0,0,0.55) 100%); transition: opacity 0.3s; }
  #banner { position: absolute; top: 22%; left: 50%; transform: translate(-50%, -50%) scale(0.94); text-align: center; opacity: 0; transition: opacity 0.25s, transform 0.25s; pointer-events: none; }
  #banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #banner-title { font-size: 44px; font-weight: 900; letter-spacing: 2px; color: var(--gold); text-shadow: 0 3px 0 rgba(0,0,0,0.55), 0 0 30px rgba(255,210,62,0.4); }
  #banner-sub { font-size: 17px; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,0.8); margin-top: 4px; }
  #toast { position: absolute; bottom: 210px; left: 50%; transform: translateX(-50%); padding: 8px 16px; font-size: 14px; background: var(--panel); border-radius: 8px; opacity: 0; transition: opacity 0.25s; }
  #toast.show { opacity: 1; }
  /* ---------- Menus ---------- */
  .screen { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; background: linear-gradient(160deg, rgba(20,30,50,0.88), rgba(60,30,10,0.82)), radial-gradient(circle at 70% 20%, rgba(255,180,80,0.35), transparent 60%); }
  .card { text-align: center; max-width: 640px; padding: 34px 40px; background: rgba(8,14,20,0.82); border: 1px solid rgba(255,210,62,0.35); border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
  .card h1 { font-size: 58px; font-weight: 900; letter-spacing: 4px; color: var(--gold); text-shadow: 0 4px 0 #7a4a00, 0 0 40px rgba(255,210,62,0.35); }
  .card h2 { font-size: 30px; font-weight: 800; color: #fff; margin-bottom: 10px; }
  .tagline { font-size: 17px; color: #ffe9b0; margin: 6px 0 16px; }
  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 18px; text-align: left; font-size: 13px; color: #cfe0ea; margin: 12px 0; }
  .controls b { color: var(--gold); font-weight: 700; }
  .hint { font-size: 13px; color: #9fb4c0; line-height: 1.5; }
  .btn { display: block; width: 100%; margin: 8px 0; padding: 13px; font-size: 17px; font-weight: 700; color: #14100a; background: var(--gold); border: none; border-radius: 10px; cursor: pointer; }
  .btn:hover { background: #ffe06a; }
  .btn.ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.4); }
  .btn.ghost:hover { background: rgba(255,255,255,0.1); }
  .screen label { display: block; text-align: left; font-size: 14px; margin: 10px 0; color: #cfe0ea; }
  .screen input[type="range"], .screen select { width: 100%; margin-top: 4px; }
  #pause { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="vignette"></div>
  <div id="topleft" class="panel">
    <div id="stars">☆☆☆☆☆</div>
    <div class="bar-row"><span class="lbl">Health</span><div class="bar"><div id="health-fill"></div></div><span class="num" id="health-num">100</span></div>
    <div class="bar-row"><span class="lbl">Armour</span><div class="bar"><div id="armour-fill"></div></div><span class="num" id="armour-num">0</span></div>
    <div id="cash">$500</div>
    <div id="respect">Street · 0</div>
  </div>
  <div id="objective" class="panel"><span id="objective-text">Welcome to Solmar Bay</span><span id="objective-dist"></span></div>
  <canvas id="minimap" width="180" height="180"></canvas>
  <div id="bottomright" class="panel">
    <div><span id="speed">—</span> <span id="speed-unit"></span></div>
    <div id="weapon">P9 Sidearm</div>
    <div id="ammo">12 / 48</div>
    <div id="radio">♪ SOL FM</div>
  </div>
  <div id="prompt" style="display:none"></div>
  <div id="crosshair"></div>
  <div id="banner"><div id="banner-title"></div><div id="banner-sub"></div></div>
  <div id="toast"></div>
</div>

<div id="menu" class="screen">
  <div class="card">
    <h1 id="menu-title">SOLMAR BAY</h1>
    <div id="menu-body">
      <p class="tagline">Sun, salt, stolen cars. Build a crew. Own the Bay.</p>
      <p class="controls"></p>
      <p class="hint">Ten story missions. Street races. A garage, a gun shop, three safehouses.<br>Five stars of Bay PD. One Bay King.</p>
    </div>
    <button id="btn-new" class="btn">New Game</button>
    <button id="btn-continue" class="btn ghost">Continue</button>
    <button id="btn-settings" class="btn ghost">Settings</button>
  </div>
</div>

<div id="pause" class="screen">
  <div class="card">
    <h2 id="pause-title">Paused</h2>
    <div id="pause-body"></div>
    <button id="btn-resume" class="btn">Resume</button>
    <button id="btn-save" class="btn ghost">Save game</button>
    <button id="btn-settings-back" class="btn ghost">Settings</button>
    <button id="btn-mute" class="btn ghost">Mute / unmute</button>
    <button id="btn-quit" class="btn ghost">Save &amp; quit to menu</button>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module">
  import { Game } from './src/main.js';
  const game = new Game();
  game.loop();
  // Auto-start when a screenshot scene is requested (?shot=...): skip the menu
  // so the shot shows the game itself, HUD and all.
  if (game.shot) game.start();
</script>
</body>
</html>
